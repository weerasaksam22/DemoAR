<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Simple Mobile AR Lab - Cute Sticker Orbit</title>

  <!-- Open-source libraries. The versions are pinned so A-Frame and AR.js match. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 16px;
      background: rgba(35, 19, 46, 0.72);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(7px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 145px;
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    }

    #run-button {
      background: #ffffff;
      color: #31233a;
    }

    #speed-button {
      background: #ffb8d2;
      color: #4f2337;
    }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.82;
    }
  </style>

  <script>
    // หมุน entity รอบแกน Y เหมาะกับกลุ่มสติ๊กเกอร์ที่โคจรรอบจุดศูนย์กลาง
    AFRAME.registerComponent('spin-control', {
      schema: {
        speed: { type: 'number', default: 35 },
        active: { type: 'boolean', default: true }
      },

      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;
        const radians = THREE.MathUtils.degToRad(this.data.speed * deltaMs / 1000);
        this.el.object3D.rotation.y += radians;
      }
    });

    // ทำให้สติ๊กเกอร์หันเข้าหากล้องเสมอ
    AFRAME.registerComponent('look-at-camera', {
      init: function () {
        this.cameraPosition = new THREE.Vector3();
      },

      tick: function () {
        const camera = this.el.sceneEl && this.el.sceneEl.camera;
        if (!camera) return;
        camera.getWorldPosition(this.cameraPosition);
        this.el.object3D.lookAt(this.cameraPosition);
      }
    });

    // สร้าง texture สติ๊กเกอร์แบบวาดด้วย Canvas เพื่อให้ไฟล์ยังคงเป็น HTML ไฟล์เดียว
    AFRAME.registerComponent('cute-sticker', {
      schema: {
        type: { type: 'string', default: 'heart' }
      },

      init: function () {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const stroke = (width = 26) => {
          ctx.lineWidth = width;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        };

        const face = (x, y, scale = 1) => {
          ctx.fillStyle = '#2b2030';
          ctx.beginPath();
          ctx.arc(x - 42 * scale, y, 14 * scale, 0, Math.PI * 2);
          ctx.arc(x + 42 * scale, y, 14 * scale, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#2b2030';
          ctx.lineWidth = 11 * scale;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(x, y + 16 * scale, 34 * scale, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();

          ctx.fillStyle = '#ff8faf';
          ctx.globalAlpha = 0.72;
          ctx.beginPath();
          ctx.arc(x - 78 * scale, y + 31 * scale, 18 * scale, 0, Math.PI * 2);
          ctx.arc(x + 78 * scale, y + 31 * scale, 18 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        };

        const drawHeart = () => {
          ctx.beginPath();
          ctx.moveTo(256, 414);
          ctx.bezierCurveTo(102, 315, 72, 208, 124, 144);
          ctx.bezierCurveTo(178, 79, 240, 117, 256, 161);
          ctx.bezierCurveTo(272, 117, 334, 79, 388, 144);
          ctx.bezierCurveTo(440, 208, 410, 315, 256, 414);
          ctx.fillStyle = '#ff91b4';
          ctx.fill();
          stroke(34);
          face(256, 238, 0.9);
        };

        const drawStar = () => {
          const points = [];
          for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const radius = i % 2 === 0 ? 172 : 78;
            points.push([256 + Math.cos(angle) * radius, 256 + Math.sin(angle) * radius]);
          }
          ctx.beginPath();
          ctx.moveTo(points[0][0], points[0][1]);
          points.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
          ctx.closePath();
          ctx.fillStyle = '#ffd968';
          ctx.fill();
          stroke(34);
          face(256, 252, 0.82);
        };

        const drawFlower = () => {
          const petalColors = ['#ffa9c3', '#ffc3d6', '#ff9fbe', '#ffd0df', '#f8b3d0'];
          for (let i = 0; i < 5; i++) {
            const angle = -Math.PI / 2 + i * Math.PI * 2 / 5;
            const x = 256 + Math.cos(angle) * 104;
            const y = 256 + Math.sin(angle) * 104;
            ctx.beginPath();
            ctx.arc(x, y, 92, 0, Math.PI * 2);
            ctx.fillStyle = petalColors[i];
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 24;
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(256, 256, 92, 0, Math.PI * 2);
          ctx.fillStyle = '#ffe077';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 20;
          ctx.stroke();
          face(256, 248, 0.7);
        };

        const drawCloud = () => {
          const blobs = [
            [156, 278, 88], [225, 220, 103], [316, 229, 95],
            [374, 292, 78], [270, 307, 130]
          ];
          ctx.fillStyle = '#eefaff';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 28;
          blobs.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
          face(264, 286, 0.74);
        };

        const drawBunny = () => {
          ctx.fillStyle = '#fff2f7';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 28;

          ctx.beginPath();
          ctx.ellipse(190, 147, 55, 120, -0.2, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(322, 147, 55, 120, 0.2, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();

          ctx.beginPath();
          ctx.arc(256, 290, 150, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#ffb4ca';
          ctx.beginPath();
          ctx.ellipse(194, 146, 18, 68, -0.2, 0, Math.PI * 2);
          ctx.ellipse(318, 146, 18, 68, 0.2, 0, Math.PI * 2);
          ctx.fill();
          face(256, 284, 0.8);
        };

        const drawSparkle = () => {
          const drawDiamond = (x, y, rx, ry, color) => {
            ctx.beginPath();
            ctx.moveTo(x, y - ry);
            ctx.quadraticCurveTo(x + rx * 0.28, y - ry * 0.28, x + rx, y);
            ctx.quadraticCurveTo(x + rx * 0.28, y + ry * 0.28, x, y + ry);
            ctx.quadraticCurveTo(x - rx * 0.28, y + ry * 0.28, x - rx, y);
            ctx.quadraticCurveTo(x - rx * 0.28, y - ry * 0.28, x, y - ry);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 26;
            ctx.stroke();
          };
          drawDiamond(256, 250, 120, 170, '#c9a7ff');
          drawDiamond(374, 125, 42, 58, '#8ddcff');
          drawDiamond(118, 360, 38, 54, '#ff9fca');
        };

        const drawSmile = () => {
          ctx.beginPath();
          ctx.arc(256, 256, 174, 0, Math.PI * 2);
          ctx.fillStyle = '#ffc7dc';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 34;
          ctx.stroke();
          face(256, 246, 1.12);

          ctx.fillStyle = 'rgba(255,255,255,0.72)';
          ctx.beginPath();
          ctx.ellipse(196, 172, 34, 18, -0.55, 0, Math.PI * 2);
          ctx.fill();
        };

        ctx.clearRect(0, 0, 512, 512);
        ctx.shadowColor = 'rgba(42, 18, 49, 0.20)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 10;

        const type = this.data.type;
        if (type === 'star') drawStar();
        else if (type === 'flower') drawFlower();
        else if (type === 'cloud') drawCloud();
        else if (type === 'bunny') drawBunny();
        else if (type === 'sparkle') drawSparkle();
        else if (type === 'smile') drawSmile();
        else drawHeart();

        const texture = new THREE.CanvasTexture(canvas);
        if ('colorSpace' in texture && THREE.SRGBColorSpace) {
          texture.colorSpace = THREE.SRGBColorSpace;
        }
        texture.needsUpdate = true;
        this.texture = texture;

        const applyMaterial = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            alphaTest: 0.03,
            depthWrite: false,
            side: THREE.DoubleSide
          });
          mesh.material.needsUpdate = true;
        };

        if (this.el.getObject3D('mesh')) applyMaterial();
        this.el.addEventListener('object3dset', applyMaterial);
      },

      remove: function () {
        if (this.texture) this.texture.dispose();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const orbit = document.querySelector('#sticker-orbit');
      const topPanel = document.querySelector('#top-panel');
      const runButton = document.querySelector('#run-button');
      const speedButton = document.querySelector('#speed-button');

      let running = true;
      const speeds = [24, 42, 68];
      const speedLabels = ['ช้า', 'ปกติ', 'เร็ว'];
      let speedIndex = 1;

      orbit.setAttribute('spin-control', 'speed', speeds[speedIndex]);

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว ✨<span class="hint">สติ๊กเกอร์น่ารักกำลังหมุนรอบจุดศูนย์กลาง</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">ให้เห็นกรอบดำครบทั้งสี่ด้าน และหลีกเลี่ยงแสงสะท้อน</span>';
      });

      runButton.addEventListener('click', () => {
        running = !running;
        orbit.setAttribute('spin-control', 'active', running);
        runButton.textContent = running ? '⏸ หยุดสติ๊กเกอร์' : '▶ ให้สติ๊กเกอร์หมุน';
      });

      speedButton.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        orbit.setAttribute('spin-control', 'speed', speeds[speedIndex]);
        speedButton.textContent = `💫 ความเร็ว: ${speedLabels[speedIndex]}`;
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="run-button" type="button">⏸ หยุดสติ๊กเกอร์</button>
    <button id="speed-button" type="button">💫 ความเร็ว: ปกติ</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true; alpha: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <!-- สติ๊กเกอร์หลักตรงกลาง -->
      <a-plane
        position="0 0.70 0"
        width="0.72"
        height="0.72"
        cute-sticker="type: smile"
        look-at-camera
      ></a-plane>

      <!-- วงแหวนสติ๊กเกอร์ หมุนรอบตัวกลาง -->
      <a-entity id="sticker-orbit" position="0 0.02 0" spin-control="speed: 42; active: true">
        <a-plane position="0.00 1.06 -0.92" width="0.38" height="0.38" cute-sticker="type: heart" look-at-camera></a-plane>
        <a-plane position="0.68 0.92 -0.66" width="0.36" height="0.36" cute-sticker="type: star" look-at-camera></a-plane>
        <a-plane position="0.96 0.72 0.00" width="0.34" height="0.34" cute-sticker="type: flower" look-at-camera></a-plane>
        <a-plane position="0.68 0.90 0.66" width="0.38" height="0.38" cute-sticker="type: bunny" look-at-camera></a-plane>
        <a-plane position="0.00 1.02 0.92" width="0.40" height="0.40" cute-sticker="type: cloud" look-at-camera></a-plane>
        <a-plane position="-0.68 0.84 0.66" width="0.33" height="0.33" cute-sticker="type: sparkle" look-at-camera></a-plane>
        <a-plane position="-0.96 0.76 0.00" width="0.35" height="0.35" cute-sticker="type: star" look-at-camera></a-plane>
        <a-plane position="-0.68 0.94 -0.66" width="0.36" height="0.36" cute-sticker="type: heart" look-at-camera></a-plane>
      </a-entity>

      <!-- สติ๊กเกอร์จิ๋ววงใน เพิ่มมิติและความน่ารัก -->
      <a-entity id="mini-orbit" position="0 0.08 0" spin-control="speed: -64; active: true">
        <a-plane position="0.52 0.55 0.00" width="0.18" height="0.18" cute-sticker="type: sparkle" look-at-camera></a-plane>
        <a-plane position="-0.52 0.62 0.00" width="0.18" height="0.18" cute-sticker="type: flower" look-at-camera></a-plane>
        <a-plane position="0.00 0.52 0.52" width="0.17" height="0.17" cute-sticker="type: heart" look-at-camera></a-plane>
        <a-plane position="0.00 0.60 -0.52" width="0.17" height="0.17" cute-sticker="type: star" look-at-camera></a-plane>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
